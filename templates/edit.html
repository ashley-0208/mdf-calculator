<!DOCTYPE html>

<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>ویرایش متریال</title>
</head>

<body>

```
<h1>ویرایش متریال</h1>

<form method="POST">

    <label>نام متریال</label>
    <br>

    <input
        type="text"
        name="name"
        value="{{ material.name }}"
        required
    >

    <br><br>

    <label>عرض ورق</label>
    <br>

    <input
        type="number"
        name="width"
        value="{{ material.width }}"
        required
    >

    <br><br>

    <label>طول ورق</label>
    <br>

    <input
        type="number"
        name="height"
        value="{{ material.height }}"
        required
    >

    <br><br>

    <label>قیمت</label>
    <br>

    <input
        type="number"
        name="price"
        value="{{ material.price }}"
        required
    >

    <br><br>

    <button type="submit">

        ذخیره تغییرات

    </button>

</form>

<br>

<a href="/">

    بازگشت به صفحه اصلی

</a>
```

</body>

</html>
